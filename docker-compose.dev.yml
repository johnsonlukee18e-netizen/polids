# backend/ i frontend/ z dysku + autoreload
services:
  app:
    command: ["uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "1337",
              "--reload", "--reload-dir", "backend"]
    environment:
      WATCHFILES_FORCE_POLLING: "true"  # Docker Desktop nie przekazuje inotify
    volumes:
      - ./backend:/app/backend:ro
      - ./frontend:/app/frontend:ro
