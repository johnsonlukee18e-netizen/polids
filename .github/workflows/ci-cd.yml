# testy na każdy push/PR, obraz do GHCR z main, deploy na VPS gdy ustawione vars.DEPLOY_HOST
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          load: true
          tags: polids-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run --rm polids-test

  image:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - id: ref
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        # ghcr chce małe litery
        run: echo "image=ghcr.io/${REPO,,}:sha-${SHA::7}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: image
    if: vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      SSH_HOST: ${{ vars.DEPLOY_HOST }}
      SSH_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
      DEPLOY_DIR: ${{ vars.DEPLOY_PATH || '/opt/polids' }}
      HEALTH_URL: ${{ vars.DEPLOY_URL }}
      IMAGE: ${{ needs.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: ssh setup
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host polids\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n  BatchMode yes\n' \
            "$SSH_HOST" "$SSH_USER" > ~/.ssh/config
      - name: copy compose files
        run: |
          # shellcheck disable=SC2029
          ssh polids "mkdir -p '$DEPLOY_DIR/deploy'"
          scp docker-compose.yml docker-compose.prod.yml "polids:$DEPLOY_DIR/"
          scp deploy/Caddyfile "polids:$DEPLOY_DIR/deploy/"
      - name: deploy
        run: |
          # shellcheck disable=SC2029
          ssh polids "cd '$DEPLOY_DIR' && export POLIDS_IMAGE='$IMAGE' \
            && docker compose -f docker-compose.yml -f docker-compose.prod.yml pull \
            && docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans \
            && docker image prune -f"
      - name: healthcheck
        if: env.HEALTH_URL != ''
        run: |
          for _ in $(seq 1 20); do
            if curl -fsS "$HEALTH_URL/healthz"; then exit 0; fi
            sleep 5
          done
          echo "healthz nie odpowiada" >&2
          exit 1
