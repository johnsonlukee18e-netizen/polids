name: Deploy (VPS)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, linux, polids]
    environment: production
    timeout-minutes: 30
    steps:
      - name: Update i build na VPS
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/polids' }}
        run: |
          cd "$DEPLOY_PATH"
          sh deploy/update.sh
      # po git pull w update.sh skrypt jest już w nowej wersji; log aplikacji bez IP i CID (log Actions jest publiczny)
      - name: Diagnostyka, gdy aplikacja nie wstała
        if: failure()
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/polids' }}
        run: |
          cd "$DEPLOY_PATH"
          if [ -f deploy/diagnose.sh ]; then sh deploy/diagnose.sh; fi
