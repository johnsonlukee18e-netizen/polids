# /etc/nginx/sites-available/polids.pl  (ln -s do sites-enabled)
# Cloudflare (proxy, SSL Full strict) -> nginx -> 127.0.0.1:1337

server {
    listen 80;
    listen [::]:80;
    server_name polids.pl www.polids.pl;
    return 301 https://polids.pl$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name polids.pl www.polids.pl;

    # Cloudflare Origin Certificate (SSL/TLS -> Origin Server)
    ssl_certificate     /etc/ssl/cloudflare/polids.pl.pem;
    ssl_certificate_key /etc/ssl/cloudflare/polids.pl.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # prawdziwe IP z CF-Connecting-IP i wpuszczanie tylko adresów Cloudflare (deploy/nginx/cloudflare-update.sh)
    include /etc/nginx/snippets/cloudflare.conf;

    if ($host = www.polids.pl) {
        return 301 https://polids.pl$request_uri;
    }

    client_max_body_size 1m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:1337;
        proxy_http_version 1.1;
        # Host i Origin muszą dojść bez zmian - aplikacja porównuje je przy POST (CSRF)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
