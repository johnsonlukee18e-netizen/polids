<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · {{NAME}}</title>
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <style>
    @font-face { font-family: "Atkinson Hyperlegible Next"; font-weight: 400; font-display: swap;
      src: url("/static/fonts/AtkinsonHyperlegibleNext-Regular-latin.woff2") format("woff2"); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
    @font-face { font-family: "Atkinson Hyperlegible Next"; font-weight: 400; font-display: swap;
      src: url("/static/fonts/AtkinsonHyperlegibleNext-Regular-latin-ext.woff2") format("woff2"); unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
    /* style inline - /static wymaga zalogowania */
    :root { --bg: #000; --panel: #0d0f0d; --line: #2a2f2a; --text: #e8e8e8; --muted: #8c948c;
            --green-text: #5fbf4a; --yellow: #f2d21b; --bad: #e0302a; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: var(--bg); color: var(--text); font: 14px/1.45 "Atkinson Hyperlegible Next", Arial, "Liberation Sans", "Helvetica Neue", Helvetica, sans-serif;
           display: flex; align-items: center; justify-content: center; padding: 16px; }
    main { width: 100%; max-width: 420px; background: var(--panel); border: 1px solid var(--line); border-radius: 0; }
    header { padding: 18px 20px 14px; border-bottom: 1px solid var(--line); text-align: center; }
    header img { width: 240px; max-width: 100%; height: auto; display: block; margin: 2px auto 8px; }
    header small { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; }
    section { padding: 18px 20px 20px; }
    .btn { display: block; width: 100%; padding: 9px 6px; margin-top: 6px; text-align: center; text-decoration: none;
           background: linear-gradient(#45a832, #2f8a22); border: 1px solid #1f5a16; border-radius: 0; color: #f4fff0;
           font: 15px/1.35 "Atkinson Hyperlegible Next", Arial, "Liberation Sans", "Helvetica Neue", Helvetica, sans-serif; text-transform: uppercase; letter-spacing: .3px; cursor: pointer; }
    .btn:hover { background: linear-gradient(#52bd3c, #36992a); }
    .btn:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--green-text); outline-offset: 1px; }
    label { display: block; margin-bottom: 9px; color: var(--muted); font-size: 12px; }
    input, select { display: block; width: 100%; margin-top: 3px; padding: 6px 8px; background: #000; color: var(--text);
                    border: 1px solid var(--line); border-radius: 0; font: 14px "Atkinson Hyperlegible Next", Arial, "Liberation Sans", "Helvetica Neue", Helvetica, sans-serif; }
    .error { margin: 0 0 12px; padding: 8px 10px; border: 1px solid var(--bad); color: #ffb3ad; }
    .warn { margin: 0 0 12px; color: var(--yellow); font-size: 12px; }
    .hint { margin: 12px 0 0; color: var(--muted); font-size: 12px; }
    footer { padding: 8px 20px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; text-align: center; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1 style="margin:0"><img src="/static/icons/polids-logo-bez-podpisu.svg" alt="{{NAME}}"></h1>
      <small>{{TAGLINE}}</small>
    </header>
    <section>
      {{ERROR}}
      {{BODY}}
    </section>
    <footer>v{{VERSION}}</footer>
  </main>
</body>
</html>
