<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>No connection</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body { background: #000; color: #e8e8e8; font: 14px/1.5 Arial, "Liberation Sans", "Helvetica Neue", Helvetica, sans-serif;
           display: flex; align-items: center; justify-content: center; padding: 16px; text-align: center; }
    h1 { font: 20px Arial, "Liberation Sans", "Helvetica Neue", Helvetica, sans-serif; color: #f2d21b; margin: 0 0 8px; }
    p { color: #8c948c; margin: 0 0 16px; }
    button { padding: 8px 18px; background: linear-gradient(#45a832, #2f8a22); border: 1px solid #1f5a16;
             border-radius: 0; color: #f4fff0; font: 14px Arial, "Liberation Sans", "Helvetica Neue", Helvetica, sans-serif; cursor: pointer; }
  </style>
</head>
<body>
  <div>
    <h1>No connection to the server</h1>
    <p>The application needs an internet connection (weather, traffic and flow data are live).</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
